<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" preserveAspectRatio="none" role="img" aria-labelledby="lines-title lines-desc">
  <title id="lines-title">Fixed physical hardware</title>
  <desc id="lines-desc">Three static horizontal lines represent the same underlying hardware. This decorative background is a conceptual illustration, not measured data.</desc>
  <line x1="0" y1="65" x2="1200" y2="65" stroke="#8a8581" opacity="0.22" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#8a8581" opacity="0.22" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
  <line x1="0" y1="175" x2="1200" y2="175" stroke="#8a8581" opacity="0.22" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
</svg>
