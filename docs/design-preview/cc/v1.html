<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V1 · One session, side by side</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stage.css">
  <link rel="stylesheet" href="v1.css">
</head>
<body>
  <div class="viewport"><div class="stage" id="stage">
    <div class="eyebrow">Claude Code workload</div>
    <div class="title">One coding session, replayed on both</div>
    <div class="side-name" style="left:40px">Dynamo</div>
    <div class="side-name ours" style="left:980px">Evolving Infra</div>
    <div class="panel" id="v1-panel-dyn" style="left:40px;top:232px;width:900px;height:500px"></div>
    <div class="panel ours" id="v1-panel-ours" style="left:980px;top:232px;width:900px;height:500px"></div>
    <!-- icons, ribbons, badges, tick bars: built by v1.js in stage coordinates -->
    <svg class="v1-svg" id="v1-svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true"><defs id="v1-defs"></defs></svg>
    <!-- end-state caption: numbers filled in by v1.js from CC_DATA.one_agent (dyn_wait, ours_wait) -->
    <div class="v1-caption" id="v1-caption"></div>
    <div class="v1-tag" id="v1-tag">One example session · same tools on both</div>
    <div class="v1-legend">
      <span><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="#f0a830" fill-rule="evenodd" d="M6 2H18V8L14 12L18 16V22H6V16L10 12L6 8Z M8 20H16V16.5L12 12.5L8 16.5Z"/><path fill="#f0a830" d="M9.2 20H14.8L12 17.6Z"/></svg>waiting for the model</span>
      <span><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="#3ecf8e" d="M9 4L11.5 9.5L17 12L11.5 14.5L9 20L6.5 14.5L1 12L6.5 9.5Z M19 1L20.25 3.75L23 5L20.25 6.25L19 9L17.75 6.25L15 5L17.75 3.75Z M19 15L20.25 17.75L23 19L20.25 20.25L19 23L17.75 20.25L15 19L17.75 17.75Z"/></svg>model writing</span>
      <span><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="#6b7280" d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>running a tool</span>
    </div>
    <div class="speed v1-speed"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="#9aa0ab" d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>45×</div>
  </div></div>
  <script src="cc-demo-data.js"></script>
  <script src="stage.js"></script>
  <script src="v1.js"></script>
</body>
</html>
